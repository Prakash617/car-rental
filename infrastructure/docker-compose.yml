services:
  postgres:
    image: postgres:16-alpine
    container_name: car_rental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_rental}
      POSTGRES_USER: ${POSTGRES_USER:-car_rental_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_dev_password}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-car_rental_user} -d ${POSTGRES_DB:-car_rental}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - car_rental_net

  redis:
    image: redis:7-alpine
    container_name: car_rental_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6385}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - car_rental_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: car_rental_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate_schemas &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-secret-key-replace-in-prod}
      - DATABASE_URL=postgres://${POSTGRES_USER:-car_rental_user}:${POSTGRES_PASSWORD:-secure_dev_password}@postgres:5432/${POSTGRES_DB:-car_rental}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - car_rental_net

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: car_rental_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    volumes:
      - ../backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-secret-key-replace-in-prod}
      - DATABASE_URL=postgres://${POSTGRES_USER:-car_rental_user}:${POSTGRES_PASSWORD:-secure_dev_password}@postgres:5432/${POSTGRES_DB:-car_rental}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - car_rental_net

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: car_rental_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    volumes:
      - ../backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-secret-key-replace-in-prod}
      - DATABASE_URL=postgres://${POSTGRES_USER:-car_rental_user}:${POSTGRES_PASSWORD:-secure_dev_password}@postgres:5432/${POSTGRES_DB:-car_rental}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - car_rental_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: car_rental_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - car_rental_net

networks:
  car_rental_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_media:
